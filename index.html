<!doctype html>

<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <title>Business Cards</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- Floating background shapes -->
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
    
    <header>
      <div class="header-content">
        <div class="brand">
          <div class="logo"></div>
          <div class="title">Business Cards</div>
        </div>
        <div class="header-actions">
          <a href="/copyright.html" class="btn btn-secondary">זכויות יוצרים</a>
        </div>
      </div>
    </header>
    <div class="container">
      <div class="grid">
        <section class="panel">
          <h2>התחברות</h2>
          <form id="loginForm">
            <div class="form-group">
              <label for="username">שם משתמש</label>
              <input id="username" name="username" type="text" placeholder="Michael / Zura / Lika / admin" required />
            </div>
            <div class="form-group">
              <label for="password">סיסמה</label>
              <input id="password" name="password" type="password" placeholder="Mp123456 / Zp123456 / Lp123456 / Aa123456" required />
            </div>
            <div class="btn-group">
              <button class="btn btn-primary" id="submitBtn" type="submit">התחבר</button>
              <button class="btn btn-secondary" id="logoutBtn" type="button">התנתק</button>
            </div>
            <div class="note">טיפ: Michael(Mp123456) - Admin, Zura(Zp123456) - Business, Lika(Lp123456) - Regular, admin(Aa123456) - Admin</div>
            <div id="err" class="error"></div>
          </form>
          <div style="margin-top: 1.5rem">
            <div class="note" style="margin-bottom: 0.75rem">או התחבר עם</div>
            <div class="btn-group">
              <button class="btn btn-danger" id="googleBtn" type="button" disabled>Google</button>
            </div>
            <div class="note">OAuth עם Google עדיין לא פעיל בפרויקט.</div>
          </div>
        </section>

        <section class="panel">
          <h2>כרטיסים</h2>
          <div class="btn-group">
            <button class="btn btn-primary" id="loadCards">טען כרטיסים</button>
            <button class="btn btn-secondary" id="clearCards">נקה</button>
          </div>
          <div id="cardsErr" class="error"></div>
          <div id="cardsGrid" class="cards-grid"></div>
        </section>
      </div>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const err = document.getElementById('err');
      const btn = document.getElementById('submitBtn');
      const usernameToEmail = { 
        michael: 'michael@gmail.com', 
        zura: 'zura@gmail.com', 
        lika: 'lika@gmail.com',
        admin: 'admin@gmail.com'
      };
      const logoutBtn = document.getElementById('logoutBtn');

      const loadBtn = document.getElementById('loadCards');
      const clearBtn = document.getElementById('clearCards');
      const cardsGrid = document.getElementById('cardsGrid');
      const cardsErr = document.getElementById('cardsErr');

      const API_BASE = '/api';

      async function apiFetch(path, options={}){
        const headers = Object.assign({'Content-Type':'application/json'}, options.headers||{});
        const apiPath = path.startsWith(API_BASE) ? path : `${API_BASE}${path}`;
        const res = await fetch(apiPath, Object.assign({}, options, { headers }));
        return res;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.textContent = '';
        btn.disabled = true;
        try {
          const username = document.getElementById('username').value.trim();
          const email = username.includes('@') ? username : (usernameToEmail[username.toLowerCase()] || `${username}@gmail.com`);
          const password = document.getElementById('password').value;
          const res = await apiFetch('/api/users/login', {
            method: 'POST',
            body: JSON.stringify({ email, password })
          });
          const text = await res.text();
          if (!res.ok) { err.textContent = `שגיאה ${res.status}: ${text}`; return; }
          err.textContent = 'המשתמש נמצא והכניסה נבדקה בהצלחה.';
        } catch (ex) {
          err.textContent = ex.message || 'שגיאת רשת';
        } finally {
          btn.disabled = false;
        }
      });

      logoutBtn.addEventListener('click', () => { err.textContent = 'אין מערכת התחברות פעילה כרגע.'; });

      // התחברות עם Google תופעל רק אחרי הוספת OAuth בצד השרת.
      const googleBtn = document.getElementById('googleBtn');
      googleBtn?.addEventListener('click', () => {
        err.textContent = 'OAuth עם Google עדיין לא מוגדר.';
      });

      function renderCards(cards){
        if (!Array.isArray(cards)) { cardsGrid.innerHTML = '<div class="note">אין נתונים</div>'; return; }
        cardsGrid.innerHTML = cards.map(c => `
          <div class="card">
            <div class="badge badge-primary">#${c.bizNumber ?? '—'}</div>
            <h4>${(c.title||'ללא כותרת')}</h4>
            <div class="subtitle">${c.subtitle||''}</div>
            <div class="email">${c.email||''}</div>
          </div>
        `).join('');
      }

      loadBtn.addEventListener('click', async () => {
        cardsErr.textContent = '';
        cardsGrid.innerHTML = '<div class="loading">טוען כרטיסים...</div>';
        try {
          const res = await apiFetch('/api/cards');
          const text = await res.text();
          if (!res.ok) { cardsErr.textContent = `שגיאה ${res.status}: ${text}`; return; }
          try { renderCards(JSON.parse(text)); } catch { cardsGrid.innerHTML = `<div class="claims-display">${text}</div>`; }
        } catch (ex) {
          cardsErr.textContent = ex.message || 'שגיאת רשת';
        }
      });
      clearBtn.addEventListener('click', () => { cardsGrid.innerHTML = '<div class="note">(נוקה)</div>'; });
    </script>
  </body>
  </html>
